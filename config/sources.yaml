# TheWord — Scraping Sources
# method: agentcdn (default) or browser (for JS-heavy sites)
# Each source is fetched once per pipeline run.
# Browser sources run sequentially; agentcdn sources run in parallel.

sources:
  - name: Minneapolis.org Events
    url: https://www.minneapolis.org/calendar/top-things-to-do-this-month/
    method: agentcdn  # /calendar/ hub has no inline event details; this curated list does

  - name: Minneapolis Events
    url: https://minneapolis.events
    method: agentcdn

  - name: Hennepin Arts
    url: https://hennepinarts.org/whats-on/event-calendar
    method: playwright  # JS-rendered SPA (Tessitura CMS); agentcdn gets 185-char shell

  - name: Songkick Minneapolis
    url: https://www.songkick.com/metro-areas/35130-us-twin-cities/events
    method: playwright  # JS-rendered; static HTML has artist/venue but no dates

  - name: 331 Club
    url: https://www.331club.com
    method: agentcdn  # switched from browser — agentcdn returns 200; browser daemon times out

  - name: Bandsintown Minneapolis
    url: https://www.bandsintown.com/c/minneapolis-mn
    method: playwright  # Cloudflare blocks agentcdn (403); real browser UA bypasses it

  - name: First Avenue
    url: https://first-avenue.com/calendar/
    method: agentcdn  # Replaced Uptown VFW (no upcoming events)

  - name: Nobool Presents
    url: https://noboolpresents.com/events
    method: agentcdn  # switched from browser — agentcdn returns 200; original browser timeout was intermittent

  - name: The Current Events
    url: https://www.thecurrent.org/events
    method: agentcdn
